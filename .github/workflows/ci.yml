name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Code and Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Run Linting Script
        run: ./scripts/lint.sh

  test:
    name: Run Student Test Suite
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Execute Tests
        run: ./tests/test.sh

  docker:
    name: Build & Smoke Test Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh

      - name: Execute Build and Docker Smoke Tests
        run: ./scripts/build.sh
